
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1,000 Likes to Drop!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #191f2b;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 440px;
  margin: auto;
  padding: 8px;
}

.counter {
  font-size: 29px;
  font-weight: bold;
  padding: 10px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #edf8ff;
  border-radius: 5px;
}

#controls {
  display: none;
  background: #29374b;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

input {
  width: 130px;
  padding: 10px;
  font-size: 18px;
}

button {
  background: #df3048;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 11px;
  margin: 4px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="counter" id="counter">
❤️ 0 / 1,000
</div>

<canvas id="game" width="340" height="400"></canvas>

<div id="controls">
  <p>Current total likes</p>

  <input
    id="likesInput"
    type="number"
    min="0"
    value="0"
  >

  <button id="updateBtn">UPDATE</button>

  <br>

  <button id="plus10">+10</button>
  <button id="plus50">+50</button>
  <button id="plus100">+100</button>

  <br>

  <button id="pauseBtn">PAUSE</button>
</div>

</div>

<script>

// ====================================
// GAME SETTINGS
// ====================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 340;
const H = 400;

const GOAL = 1000;
const BALL_RADIUS = 10;

// Movement speed.
// Lower numbers mean slower movement.

const SPEED = 0.65;

let likes = 0;
let paused = false;
let completed = false;
let releaseRequested = false;
let releasing = false;

// ====================================
// APPROVED RAMPS - UNCHANGED
// ====================================

const leftRamp = {
  x1: 16,
  y1: 105,
  x2: 156,
  y2: 193
};

const rightRamp = {
  x1: 323,
  y1: 62,
  x2: 184,
  y2: 193
};

// ====================================
// HEART OPENING
// ====================================

const holeLeft = 156;
const holeRight = 184;
const gateY = 225;

// ====================================
// BALL
// ====================================

const ball = {
  x: 100,
  y: 75
};

// ====================================
// CONTROLLED BOUNCE PATH
// ====================================

// Contact positions are placed near
// the visible red ramp surfaces.
//
// Each bounce travels through a high
// point before reaching another ramp.
//
// The path never enters the heart.

const contacts = [
  {x: 87,  y: 139},
  {x: 251, y: 119},
  {x: 147, y: 177},
  {x: 210, y: 156},
  {x: 106, y: 151},
  {x: 275, y: 96},
  {x: 138, y: 171},
  {x: 229, y: 138}
];

// Heights of the arcs between contacts.

const arcHeights = [
  82,
  65,
  39,
  69,
  86,
  75,
  43,
  76
];

// Duration of each arc in milliseconds.

const durations = [
  2800,
  2600,
  2300,
  2700,
  3000,
  2800,
  2400,
  2900
];

let segment = -1;
let elapsed = 0;
let previousFrame = null;

// ====================================
// LIKE COUNTER
// ====================================

function updateCounter() {
  document.getElementById("counter").textContent =
    "❤️ " + likes.toLocaleString() + " / 1,000";
}

function setLikes(value) {

  if (completed) return;

  const n = Number(value);

  if (!Number.isFinite(n) || n < 0) return;

  likes = Math.floor(n);

  document.getElementById("likesInput").value = likes;

  updateCounter();

  // Unlock only at the target.

  if (likes >= GOAL) {
    releaseRequested = true;
  } else if (!releasing) {
    releaseRequested = false;
  }
}

document.getElementById("updateBtn").onclick = () => {
  setLikes(document.getElementById("likesInput").value);
};

document.getElementById("plus10").onclick =
  () => setLikes(likes + 10);

document.getElementById("plus50").onclick =
  () => setLikes(likes + 50);

document.getElementById("plus100").onclick =
  () => setLikes(likes + 100);

document.getElementById("pauseBtn").onclick =
  function() {
    paused = !paused;
    this.textContent = paused ? "PLAY" : "PAUSE";
  };

// ====================================
// HIDDEN CONTROLS
// ====================================

// Press C to show or hide the controls.
// No Reset button appears on the game.

document.addEventListener("keydown", function(e) {

  if (
    e.key.toLowerCase() === "c" &&
    e.target.tagName !== "INPUT"
  ) {

    const panel = document.getElementById("controls");

    panel.style.display =
      panel.style.display === "block"
      ? "none"
      : "block";
  }
});

// ====================================
// DRAWING HELPERS
// ====================================

function line(x1, y1, x2, y2) {

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// ====================================
// HEART
// ====================================

function drawHeart(x, y, size) {

  ctx.save();

  ctx.translate(x, y);
  ctx.scale(size, size);

  ctx.beginPath();

  ctx.moveTo(0, 0.4);

  ctx.bezierCurveTo(
    -1.1, -0.3,
    -0.9, -1.1,
    0, -0.45
  );

  ctx.bezierCurveTo(
    0.9, -1.1,
    1.1, -0.3,
    0, 0.4
  );

  ctx.closePath();

  ctx.fillStyle = "#ff304b";
  ctx.fill();

  ctx.restore();
}

// ====================================
// SILVER BALL
// ====================================

function drawBall() {

  const gradient = ctx.createRadialGradient(
    ball.x - 3,
    ball.y - 4,
    1,
    ball.x,
    ball.y,
    BALL_RADIUS
  );

  gradient.addColorStop(0, "#ffffff");
  gradient.addColorStop(0.4, "#c5ced7");
  gradient.addColorStop(1, "#46515d");

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    BALL_RADIUS,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = gradient;
  ctx.fill();
}

// ====================================
// DRAW THE GAME
// ====================================

function drawGame() {

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = "#edf8ff";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#34445d";
  ctx.font = "bold 12px Arial";

  ctx.fillText(
    "1,000 LIKES TO DROP!",
    W / 2,
    24
  );

  ctx.strokeStyle = "#df3048";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Your original approved ramps.

  line(
    leftRamp.x1,
    leftRamp.y1,
    leftRamp.x2,
    leftRamp.y2
  );

  line(
    rightRamp.x1,
    rightRamp.y1,
    rightRamp.x2,
    rightRamp.y2
  );

  // Heart opening.

  line(holeLeft, 193, holeLeft, gateY);
  line(holeRight, 193, holeRight, gateY);

  // Gate remains closed before 1,000.

  if (likes < GOAL) {

    line(holeLeft, gateY, holeRight, gateY);

    drawHeart(170, 217, 11);

  } else {

    drawHeart(170, 246, 11);

  }

  if (!completed) {
    drawBall();
  }

  if (completed) {

    ctx.font = "bold 25px Arial";
    ctx.fillStyle = "#169b59";

    ctx.fillText(
      "YOU DID IT!",
      W / 2,
      330
    );
  }
}

// ====================================
// MOVEMENT HELPERS
// ====================================

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Smooth timing without abrupt stops
// in the middle of each flight.

function ease(t) {
  return t * t * (3 - 2 * t);
}

// ====================================
// RELEASE ANIMATION
// ====================================

let releaseElapsed = 0;
let releaseStart = null;

function startRelease() {

  releasing = true;
  releaseRequested = false;
  releaseElapsed = 0;

  releaseStart = {
    x: ball.x,
    y: ball.y
  };
}

function moveRelease(delta) {

  releaseElapsed += delta;

  // Approach the now-open heart.

  if (releaseElapsed < 2200) {

    const t = ease(
      Math.min(releaseElapsed / 2200, 1)
    );

    ball.x = lerp(releaseStart.x, 170, t);
    ball.y = lerp(releaseStart.y, 211, t);

  } else {

    // Drop through the opening.

    const t = Math.min(
      (releaseElapsed - 2200) / 1600,
      1
    );

    ball.x = 170;
    ball.y = 211 + 205 * t * t;

    if (t >= 1) {
      completed = true;
    }
  }
}

// ====================================
// CONTROLLED BALL MOVEMENT
// ====================================

function moveBall(delta) {

  if (paused || completed) return;

  if (releasing) {
    moveRelease(delta);
    return;
  }

  // At 1,000 likes, release the ball.

  if (releaseRequested) {
    startRelease();
    moveRelease(delta);
    return;
  }

  elapsed += delta * SPEED;

  // Initial drop to the first ramp.

  if (segment === -1) {

    const t = Math.min(elapsed / 1800, 1);

    ball.x = lerp(100, contacts[0].x, t);
    ball.y = lerp(75, contacts[0].y, t * t);

    if (t >= 1) {
      segment = 0;
      elapsed = 0;
    }

    return;
  }

  // Each segment moves between two
  // ramp-contact positions.

  const start = contacts[segment];

  const nextIndex =
    (segment + 1) % contacts.length;

  const end = contacts[nextIndex];

  const duration = durations[segment];

  const t = Math.min(
    elapsed / duration,
    1
  );

  // Horizontal travel.

  ball.x = lerp(
    start.x,
    end.x,
    ease(t)
  );

  // Vertical travel with a visible arc.
  // Both endpoints remain near the ramps.

  ball.y =
    lerp(start.y, end.y, t) -
    arcHeights[segment] *
    4 * t * (1 - t);

  if (t >= 1) {

    segment = nextIndex;
    elapsed = 0;
  }
}

// ====================================
// ANIMATION LOOP
// ====================================

function animate(time) {

  if (previousFrame === null) {
    previousFrame = time;
  }

  const delta = Math.min(
    time - previousFrame,
    50
  );

  previousFrame = time;

  moveBall(delta);
  drawGame();

  requestAnimationFrame(animate);
}

// ====================================
// START
// ====================================

updateCounter();
requestAnimationFrame(animate);

</script>

</body>
</html>
