
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Doc's One Ball Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151b27;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.game-container {
  width: 100%;
  max-width: 450px;
  margin: auto;
  padding: 10px;
}

h1 {
  font-size: 26px;
  margin: 10px 0;
  color: #ff4757;
}

.counter {
  font-size: 28px;
  font-weight: bold;
  margin: 12px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #edf8ff;
  border-radius: 6px;
}

.controls {
  display: none;
  margin-top: 15px;
}

input {
  width: 140px;
  padding: 12px;
  font-size: 18px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 12px 16px;
  margin: 5px;
  border: none;
  border-radius: 6px;
  background: #e63249;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.status {
  font-size: 15px;
  margin: 12px;
}
</style>
</head>

<body>

<div class="game-container">

<h1>DON'T LET IT DROP!</h1>

<div class="counter" id="counter">
❤️ 0 / 1,000
</div>

<canvas
  id="game"
  width="360"
  height="410">
</canvas>

<div class="status" id="status">
Keep the ball bouncing!
</div>

<div class="controls" id="controls">

<input
  type="number"
  id="likesInput"
  placeholder="Total likes"
  min="0"
  value="0">

<button id="updateBtn">
UPDATE
</button>

<button id="plus100">
+100
</button>

</div>

</div>

<script>

// ====================================
// ORIGINAL GAME SETTINGS
// ====================================

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const GOAL = 1000;

let likes = 0;
let finished = false;
let releasing = false;

// ====================================
// ORIGINAL RED RAMPS
// UNCHANGED
// ====================================

const ramps = [
  [[16,125],[170,215]],
  [[190,215],[344,125]]
];

// ====================================
// ORIGINAL OPENING
// ====================================

const leftWall = 170;
const rightWall = 190;
const gateY = 275;

// ====================================
// BALL
// ====================================

const ball = {
  x: 180,
  y: 65,
  vx: 2.6,
  vy: 0,
  radius: 8
};

// ====================================
// PHYSICS
// ====================================

// Moderate gravity and powered bounces.

const gravity = 0.16;

const bounce = 0.94;

const MAX_SPEED = 7.5;

const MIN_BOUNCE = 4.6;

// Red lines have a width of 7.
// Collision includes half that width.

const LINE_RADIUS = 3.5;

// ====================================
// LIKE COUNTER
// ====================================

function updateDisplay() {

  document.getElementById(
    "counter"
  ).textContent =
    "❤️ " +
    likes.toLocaleString() +
    " / 1,000";

  if (finished) {

    document.getElementById(
      "status"
    ).textContent =
      "YOU DID IT!";

  } else if (likes >= GOAL) {

    document.getElementById(
      "status"
    ).textContent =
      "GOAL REACHED!";

  } else {

    document.getElementById(
      "status"
    ).textContent =
      "Keep the ball bouncing!";

  }
}

function updateLikes() {

  const input =
    document.getElementById(
      "likesInput"
    );

  if (input.value.trim() === "") {
    return;
  }

  const value = Number(input.value);

  if (
    !Number.isFinite(value) ||
    value < 0
  ) {
    return;
  }

  likes = Math.floor(value);

  updateDisplay();

  if (
    likes >= GOAL &&
    !releasing &&
    !finished
  ) {
    startRelease();
  }
}

document.getElementById(
  "updateBtn"
).onclick = updateLikes;

document.getElementById(
  "plus100"
).onclick = function() {

  if (releasing || finished) return;

  likes += 100;

  document.getElementById(
    "likesInput"
  ).value = likes;

  updateDisplay();

  if (likes >= GOAL) {
    startRelease();
  }
};

// ====================================
// HIDDEN CONTROLS
// ====================================

// Press C to reveal controls.
// Press C again to hide them.

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key.toLowerCase() === "c" &&
      event.target.tagName !== "INPUT"
    ) {

      const panel =
        document.getElementById(
          "controls"
        );

      panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
    }
  }
);

// ====================================
// ACTUAL LINE COLLISION
// ====================================

function collide(
  ax,
  ay,
  bx,
  by,
  powered = false
) {

  const dx = bx - ax;
  const dy = by - ay;

  const lengthSquared =
    dx * dx + dy * dy;

  const projection =
    ((ball.x - ax) * dx +
     (ball.y - ay) * dy) /
    lengthSquared;

  const t = Math.max(
    0,
    Math.min(1, projection)
  );

  const px = ax + t * dx;
  const py = ay + t * dy;

  let nx = ball.x - px;
  let ny = ball.y - py;

  let distance = Math.hypot(
    nx,
    ny
  );

  const minimum =
    ball.radius + LINE_RADIUS;

  if (distance >= minimum) {
    return false;
  }

  if (distance < 0.0001) {

    nx = -dy;
    ny = dx;

    distance = Math.hypot(
      nx,
      ny
    );
  }

  nx /= distance;
  ny /= distance;

  // Move the ball outside the line.

  ball.x = px + nx * minimum;
  ball.y = py + ny * minimum;

  // Calculate approach velocity.

  const velocity =
    ball.vx * nx +
    ball.vy * ny;

  if (velocity >= 0) {
    return false;
  }

  // Reflect velocity off the
  // actual visible line.

  ball.vx -=
    (1 + bounce) *
    velocity * nx;

  ball.vy -=
    (1 + bounce) *
    velocity * ny;

  // Restore enough energy to keep
  // the ball moving after ramp contact.

  if (powered) {

    const speed = Math.hypot(
      ball.vx,
      ball.vy
    );

    if (speed < MIN_BOUNCE) {

      const factor =
        MIN_BOUNCE /
        Math.max(speed, 0.001);

      ball.vx *= factor;
      ball.vy *= factor;
    }

    // Give a modest upward push
    // after landing on a ramp.

    if (ball.vy > -2.5) {
      ball.vy = -2.5;
    }
  }

  return true;
}

// ====================================
// KEEP BALL INSIDE PLAYING AREA
// ====================================

// The canvas edges act as boundaries.
// These do not change the red ramps.

function containBall() {

  const r = ball.radius;

  if (ball.x < r) {

    ball.x = r;
    ball.vx = Math.abs(ball.vx);

  }

  if (ball.x > W - r) {

    ball.x = W - r;
    ball.vx = -Math.abs(ball.vx);

  }

  if (ball.y < 39 + r) {

    ball.y = 39 + r;
    ball.vy = Math.abs(ball.vy);

  }

  // A safety boundary prevents
  // escape if the ball travels
  // outside the V-shaped ramps.

  if (ball.y > H - r) {

    ball.y = H - r;

    ball.vy =
      -Math.max(
        MIN_BOUNCE,
        Math.abs(ball.vy)
      );

  }
}

// ====================================
// BALL PHYSICS
// ====================================

function moveBall() {

  if (finished || releasing) {
    return;
  }

  // Eight smaller physics steps
  // reduce tunneling through lines.

  for (
    let step = 0;
    step < 8;
    step++
  ) {

    ball.vy += gravity / 8;

    ball.x += ball.vx / 8;
    ball.y += ball.vy / 8;

    // Original red ramps.

    ramps.forEach(function(ramp) {

      collide(
        ramp[0][0],
        ramp[0][1],
        ramp[1][0],
        ramp[1][1],
        true
      );

    });

    // Vertical opening sides.

    collide(
      leftWall,
      215,
      leftWall,
      gateY
    );

    collide(
      rightWall,
      215,
      rightWall,
      gateY
    );

    // Physical gate remains closed
    // until the goal is reached.

    if (likes < GOAL) {

      collide(
        leftWall,
        gateY,
        rightWall,
        gateY,
        true
      );

    }

    // Keep the ball on-screen.

    containBall();

    // Limit excessive speed.

    const speed = Math.hypot(
      ball.vx,
      ball.vy
    );

    if (speed > MAX_SPEED) {

      const factor =
        MAX_SPEED / speed;

      ball.vx *= factor;
      ball.vy *= factor;
    }

  }
}

// ====================================
// RELEASE ANIMATION
// ====================================

// At 1,000 likes, control the final
// movement so the ball passes
// through the narrow opening.
//
// Ordinary bouncing uses physics.
// Only the final release is guided.

let releaseStart = null;
let releaseElapsed = 0;

function startRelease() {

  if (releasing || finished) {
    return;
  }

  releasing = true;

  releaseElapsed = 0;

  releaseStart = {
    x: ball.x,
    y: ball.y
  };
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smooth(t) {
  return t * t * (3 - 2 * t);
}

function moveRelease(delta) {

  releaseElapsed += delta;

  // Guide ball to the center
  // of the open passage.

  if (releaseElapsed < 1800) {

    const t = smooth(
      Math.min(
        releaseElapsed / 1800,
        1
      )
    );

    ball.x = lerp(
      releaseStart.x,
      180,
      t
    );

    ball.y = lerp(
      releaseStart.y,
      235,
      t
    );

  } else {

    // Drop through the open gate.

    const t = Math.min(
      (releaseElapsed - 1800) /
      1700,
      1
    );

    ball.x = 180;

    ball.y =
      235 +
      190 * t * t;

    if (t >= 1) {
      finished = true;
      updateDisplay();
    }
  }
}

// ====================================
// DRAWING
// ====================================

function drawLine(
  x1,
  y1,
  x2,
  y2
) {

  ctx.beginPath();

  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);

  ctx.stroke();
}

// ====================================
// DRAW HEART
// ====================================

function drawHeart(x, y) {

  ctx.save();

  ctx.translate(x, y);

  ctx.beginPath();

  ctx.moveTo(0, 5);

  ctx.bezierCurveTo(
    -22, -10,
    -13, -24,
    0, -12
  );

  ctx.bezierCurveTo(
    13, -24,
    22, -10,
    0, 5
  );

  ctx.closePath();

  ctx.fillStyle = "#ff304b";

  ctx.fill();

  ctx.restore();
}

// ====================================
// SILVER BALL
// ====================================

function drawBall() {

  const gradient =
    ctx.createRadialGradient(
      ball.x - 3,
      ball.y - 4,
      1,
      ball.x,
      ball.y,
      ball.radius
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    0.35,
    "#bfc8cf"
  );

  gradient.addColorStop(
    1,
    "#46515d"
  );

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = gradient;
  ctx.fill();
}

// ====================================
// DRAW GAME
// ====================================

function drawGame() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.fillStyle = "#edf8ff";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  // Title.

  ctx.fillStyle = "#354966";

  ctx.font =
    "bold 11px Arial";

  ctx.textAlign = "center";

  ctx.fillText(
    "ONE BALL CHALLENGE",
    180,
    23
  );

  // Red ramps.

  ctx.strokeStyle = "#df3048";

  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // ORIGINAL RAMPS:
  // EXACTLY THE SAME COORDINATES.

  ramps.forEach(function(ramp) {

    drawLine(
      ramp[0][0],
      ramp[0][1],
      ramp[1][0],
      ramp[1][1]
    );

  });

  // Original vertical opening.

  drawLine(
    170,
    215,
    170,
    275
  );

  drawLine(
    190,
    215,
    190,
    275
  );

  // Locked gate.

  if (likes < GOAL) {

    drawLine(
      170,
      275,
      190,
      275
    );

  }

  // Heart is BELOW the gate.
  // It no longer overlaps the
  // ball's approach to the gate.

  drawHeart(
    180,
    314
  );

  // Lock indicator.

  ctx.font =
    "bold 11px Arial";

  ctx.fillStyle =
    likes >= GOAL
    ? "#169b59"
    : "#c43c55";

  ctx.fillText(
    likes >= GOAL
      ? "OPEN"
      : "LOCKED",
    180,
    346
  );

  // Silver ball.

  if (!finished) {

    drawBall();

  } else {

    ctx.fillStyle = "#169b59";

    ctx.font =
      "bold 25px Arial";

    ctx.fillText(
      "YOU DID IT!",
      180,
      385
    );

  }
}

// ====================================
// ANIMATION LOOP
// ====================================

let previousFrame = null;
let accumulator = 0;

const FRAME = 1000 / 60;

function animate(time) {

  if (previousFrame === null) {
    previousFrame = time;
  }

  const delta = Math.min(
    time - previousFrame,
    50
  );

  previousFrame = time;

  if (releasing) {

    moveRelease(delta);

  } else if (!finished) {

    accumulator += delta;

    while (accumulator >= FRAME) {

      moveBall();

      accumulator -= FRAME;

    }
  }

  drawGame();

  requestAnimationFrame(
    animate
  );
}

// ====================================
// START GAME
// ====================================

updateDisplay();

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
