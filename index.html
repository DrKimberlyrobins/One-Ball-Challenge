
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc's One Ball Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151b27;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.game-container {
  width: 100%;
  max-width: 450px;
  margin: auto;
  padding: 10px;
}

h1 {
  font-size: 26px;
  margin: 10px 0;
  color: #ff4757;
}

.counter {
  font-size: 28px;
  font-weight: bold;
  margin: 12px;
}

canvas {
  display: block;
  width: 100%;
  background: #edf8ff;
  border-radius: 6px;
}

.controls {
  margin-top: 15px;
}

input {
  width: 140px;
  padding: 12px;
  font-size: 18px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 12px 16px;
  margin: 5px;
  border: none;
  border-radius: 6px;
  background: #e63249;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #b91f35;
}

.status {
  font-size: 15px;
  margin: 12px;
}
</style>
</head>

<body>

<div class="game-container">

<h1>DON'T LET IT DROP!</h1>

<div class="counter" id="counter">
❤️ 0 / 1,000
</div>

<canvas id="game" width="360" height="410"></canvas>

<div class="status" id="status">
Keep the ball bouncing!
</div>

<div class="controls">

<input
  type="number"
  id="likesInput"
  placeholder="Total likes"
  min="0"
>

</div>

<script>

// GAME SETTINGS

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const GOAL = 1000;

let likes = 0;
let paused = false;
let finished = false;

// BALL

const ball = {
  x: 180,
  y: 65,
  vx: 2.6,
  vy: 0,
  radius: 8
};

// RED V-SHAPED RAMPS

const ramps = [
  [[16,125],[170,215]],
  [[190,215],[344,125]]
];

// NARROW OPENING

const leftWall = 170;
const rightWall = 190;
const gateY = 275;

// PHYSICS

const gravity = 0.24;
const bounce = 1.08;

// MANUAL LIKE COUNTER

function updateDisplay() {

  document.getElementById("counter").textContent =
    "❤️ " + likes.toLocaleString() + " / 1,000";

  if (likes >= GOAL) {
    document.getElementById("status").textContent =
      "GOAL REACHED! HEART UNLOCKED!";
  } else {
    document.getElementById("status").textContent =
      "Keep the ball bouncing!";
  }
}

function updateLikes() {

  const input = document.getElementById("likesInput");

  const value = Number(input.value);

  if (!Number.isFinite(value) || value < 0) return;

  likes = Math.floor(value);

  updateDisplay();
}

function addLikes(amount) {

  likes += amount;

  document.getElementById("likesInput").value = likes;

  updateDisplay();
}

// PAUSE

function togglePause() {

  paused = !paused;

  document.getElementById("pauseBtn").textContent =
    paused ? "PLAY" : "PAUSE";
}

// RESET

function resetGame() {

  likes = 0;
  paused = false;
  finished = false;

  ball.x = 180;
  ball.y = 65;
  ball.vx = 2.6;
  ball.vy = 0;

  document.getElementById("likesInput").value = 0;

  document.getElementById("pauseBtn").textContent =
    "PAUSE";

  updateDisplay();
}

// COLLISION WITH RED RAMPS

function collide(ax, ay, bx, by, power = 1) {

  const dx = bx - ax;
  const dy = by - ay;

  const lengthSquared = dx * dx + dy * dy;

  const t = Math.max(
    0,
    Math.min(
      1,
      ((ball.x - ax) * dx +
       (ball.y - ay) * dy) / lengthSquared
    )
  );

  const px = ax + t * dx;
  const py = ay + t * dy;

  let nx = ball.x - px;
  let ny = ball.y - py;

  let distance = Math.hypot(nx, ny);

  const minimum = ball.radius + 3.5;

  if (distance < minimum) {

    if (distance < 0.001) {
      nx = -dy;
      ny = dx;
      distance = Math.hypot(nx, ny);
    }

    nx /= distance;
    ny /= distance;

    ball.x = px + nx * minimum;
    ball.y = py + ny * minimum;

    const velocity =
      ball.vx * nx + ball.vy * ny;

    if (velocity < 0) {

      const impulse =
        (1 + bounce * power) * velocity;

      ball.vx -= impulse * nx;
      ball.vy -= impulse * ny;
    }
  }
}

// UPDATE BALL MOVEMENT

function moveBall() {

  if (paused || finished) return;

  // Smaller physics steps improve collision accuracy.

  for (let step = 0; step < 4; step++) {

    ball.vy += gravity / 4;

    ball.x += ball.vx / 4;
    ball.y += ball.vy / 4;

    // Sloping red ramps

    ramps.forEach(ramp => {
      collide(
        ramp[0][0],
        ramp[0][1],
        ramp[1][0],
        ramp[1][1]
      );
    });

    // Vertical sides of the narrow opening

    collide(170,215,170,275);
    collide(190,215,190,275);

    // Heart gate remains closed until 1,000 likes.

    if (likes < GOAL) {
      collide(170,275,190,275,1.4);
    }

    // Outer side walls bounce the ball.

    if (ball.x < ball.radius) {

      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx) * 1.12;
      ball.vy -= 2.5;
    }

    if (ball.x > W - ball.radius) {

      ball.x = W - ball.radius;
      ball.vx = -Math.abs(ball.vx) * 1.12;
      ball.vy -= 2.5;
    }

    // Upper boundary

    if (ball.y < 40) {

      ball.y = 40;
      ball.vy = Math.abs(ball.vy);
    }

    // Powered bumper keeps our ONE ball bouncing.
    // This is our first version; we will tune it.

    if (
      likes < GOAL &&
      ball.y > gateY - 10 &&
      ball.x > leftWall - 9 &&
      ball.x < rightWall + 9
    ) {

      ball.y = gateY - 12;

      ball.vy = -Math.max(
        8.5,
        Math.abs(ball.vy) * 1.2
      );

      ball.vx += ball.x < 180 ? -0.6 : 0.6;
    }

    // Ball successfully drops.

    if (ball.y > H + 15) {

      finished = true;

      document.getElementById("status").textContent =
        "🎉 YOU DID IT!";
    }

    // Prevent uncontrolled speed.

    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed > 15) {

      ball.vx *= 15 / speed;
      ball.vy *= 15 / speed;
    }
  }
}

// DRAW GAME

function drawGame() {

  ctx.clearRect(0, 0, W, H);

  // Background

  ctx.fillStyle = "#edf8ff";
  ctx.fillRect(0, 0, W, H);

  // Title

  ctx.fillStyle = "#354966";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";

  ctx.fillText(
    "ONE BALL CHALLENGE",
    180,
    23
  );

  // Red ramps

  ctx.strokeStyle = "#df3048";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ramps.forEach(ramp => {

    ctx.beginPath();

    ctx.moveTo(
      ramp[0][0],
      ramp[0][1]
    );

    ctx.lineTo(
      ramp[1][0],
      ramp[1][1]
    );

    ctx.stroke();
  });

  // Narrow vertical opening

  ctx.beginPath();

  ctx.moveTo(170,215);
  ctx.lineTo(170,275);

  ctx.moveTo(190,215);
  ctx.lineTo(190,275);

  ctx.stroke();

  // Locked gate

  if (likes < GOAL) {

    ctx.beginPath();

    ctx.moveTo(170,275);
    ctx.lineTo(190,275);

    ctx.stroke();
  }

  // HEART

  ctx.font = "23px Arial";
  ctx.textAlign = "center";

  ctx.fillText("❤️",180,270);

  // Lock status

  ctx.font = "bold 11px Arial";

  ctx.fillStyle =
    likes >= GOAL ? "#169b59" : "#c43c55";

  ctx.fillText(
    likes >= GOAL ? "OPEN" : "LOCKED",
    180,
    307
  );

  // SILVER BALL

  if (!finished) {

    const gradient =
      ctx.createRadialGradient(
        ball.x - 3,
        ball.y - 4,
        1,
        ball.x,
        ball.y,
        9
      );

    gradient.addColorStop(0,"#ffffff");
    gradient.addColorStop(0.35,"#bfc8cf");
    gradient.addColorStop(1,"#46515d");

    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      ball.radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = gradient;
    ctx.fill();

  } else {

    ctx.fillStyle = "#169b59";
    ctx.font = "bold 25px Arial";

    ctx.fillText(
      "YOU DID IT!",
      180,
      350
    );
  }
}

// ANIMATION LOOP

let lastFrame = 0;

function animate(time) {

  if (time - lastFrame >= 16) {

    moveBall();
    drawGame();

    lastFrame = time;
  }

  requestAnimationFrame(animate);
}

updateDisplay();
requestAnimationFrame(animate);

</script>

</body>
</html>
