
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>1,000 Likes to Drop!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151b27;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 450px;

}

.counter {
  font-size: 29px;

  padding: 12px;
}

canvas {
  display: block;
  width: 100%;
  background: #edf8ff;
  border-radius: 5px;
}

.controls {
  margin-top: 12px;
  padding: 12px;
  background: #263448;
  border-radius: 8px;
}

  padding: 11px;
  margin: 4px;
  background: #df3048;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

input {
  width: 130px;
  padding: 11px;
  font-size: 17px;
  border-radius: 6px;
  border: none;
}

summary {
  cursor: pointer;
  padding: 8px;
}

</style>
</head>

<body>

<div class="container">

<div class="counter" id="counter">
❤️ 0 / 1,000
</div>

<canvas id="game" width="340" height="400"></canvas>


</details>

</div>

<script>

// CANVAS

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

// GAME SETTINGS

const GOAL = 1000;

let likes = 0;
let paused = false;
let finished = false;
let escaped = false;

// BALL

const ball = {
  x: 100,
  y: 75,
  vx: 0.8,
  vy: 0,
  radius: 10
};

// PHYSICS
// Slower movement than our original version.

const gravity = 0.12;
const maxSpeed = 5.5;

// RED RAMPS
// Left: longer, shallower.
// Right: shorter, steeper.

const ramps = [

  {
    ax: 16,
    ay: 105,
    bx: 156,
    by: 193
  },

  {
    ax: 323,
    ay: 62,
    bx: 184,
    by: 193
  }

];

// HEART OPENING
// 32 pixels wide for our 16-pixel ball.

const holeLeft = 156;
const holeRight = 184;

const wallTop = 193;
const gateY = 225;

// LIKE COUNTER

function refreshCounter() {

  document.getElementById("counter").textContent =
    "❤️ " + likes.toLocaleString() + " / 1,000";

}

function updateLikes() {

  const input = document.getElementById("likesInput");

  const value = Number(input.value);

  if (
    input.value.trim() === "" ||
    !Number.isFinite(value) ||
    value < 0
  ) {
    return;
  }

  likes = Math.floor(value);

  refreshCounter();

}

function addLikes(amount) {

  likes += amount;

  document.getElementById("likesInput").value = likes;

  refreshCounter();

}

// PAUSE

function togglePause() {

  paused = !paused;

  document.getElementById("pauseButton").textContent =
    paused ? "PLAY" : "PAUSE";

}

// RESET

function resetGame() {

  likes = 0;
  paused = false;
  finished = false;
  escaped = false;

  ball.x = 100;
  ball.y = 75;
  ball.vx = 0.8;
  ball.vy = 0;

  document.getElementById("likesInput").value = 0;

  document.getElementById("pauseButton").textContent =
    "PAUSE";

  refreshCounter();

}

// COLLISION DETECTION
// The ball can bounce only when touching
// an actual visible red surface.

function collide(ax, ay, bx, by, powered = false) {

  const dx = bx - ax;
  const dy = by - ay;

  const lengthSquared = dx * dx + dy * dy;

  const t = Math.max(
    0,
    Math.min(
      1,
      (
        (ball.x - ax) * dx +
        (ball.y - ay) * dy
      ) / lengthSquared
    )
  );

  const px = ax + t * dx;
  const py = ay + t * dy;

  let nx = ball.x - px;
  let ny = ball.y - py;

  let distance = Math.hypot(nx, ny);

  const minimum = ball.radius + 3;

  if (distance >= minimum) {
    return;
  }

  if (distance < 0.001) {

    nx = -dy;
    ny = dx;

    distance = Math.hypot(nx, ny);

  }

  nx /= distance;
  ny /= distance;

  // Move the ball outside the actual red line.

  ball.x = px + nx * minimum;
  ball.y = py + ny * minimum;

  const velocity =
    ball.vx * nx +
    ball.vy * ny;

  if (velocity >= 0) {
    return;
  }

  // Powered red ramps provide the energy
  // for upward bounces.

  const restitution = powered ? 0.98 : 0.85;

  const impulse = -(1 + restitution) * velocity;

  ball.vx += impulse * nx;
  ball.vy += impulse * ny;

  // Additional upward energy is applied
  // ONLY on contact with a powered red ramp.

  if (powered && ball.vy < 0) {

    ball.vy -= 0.15;

  }

}

// UPDATE MOVEMENT

function moveBall() {

  if (paused || finished || escaped) {
    return;
  }

  // Four smaller physics steps.

  for (let step = 0; step < 4; step++) {

    ball.vy += gravity / 4;

    ball.x += ball.vx / 4;
    ball.y += ball.vy / 4;

    // Visible sloping red ramps.

    ramps.forEach(ramp => {

      collide(
        ramp.ax,
        ramp.ay,
        ramp.bx,
        ramp.by,
        true
      );

    });

    // Visible vertical sections.

    collide(
      holeLeft,
      wallTop,
      holeLeft,
      gateY
    );

    collide(
      holeRight,
      wallTop,
      holeRight,
      gateY
    );

    // The heart gate is a physical surface.
    
// HEART GATE: LAST-SECOND BOUNCE

if (likes < GOAL) {

  // The ball can approach the opening,
  // but the closed red gate stops it.

  collide(
    holeLeft,
    gateY,
    holeRight,
    gateY,
    true
  );

  // Extra protection against passing
  // through the gate at high speed.

  const nearGate =
    ball.x >= holeLeft - ball.radius &&
    ball.x <= holeRight + ball.radius;

  if (
    nearGate &&
    ball.y < gateY &&
    ball.y + ball.radius >= gateY - 3 &&
    ball.vy > 0
  ) {

    // Position the ball just above
    // the visible gate.

    ball.y = gateY - ball.radius - 3;

    // Bounce upward and slightly sideways.
    // This sends it toward another red ramp.

    ball.vy = -3.2;

    ball.vx = ball.x < 170 ? -1.4 : 1.4;

  }

}

    // Speed limit prevents wild movement.

    const speed = Math.hypot(
      ball.vx,
      ball.vy
    );

    if (speed > maxSpeed) {

      ball.vx *= maxSpeed / speed;
      ball.vy *= maxSpeed / speed;

    }

    // No invisible side or ceiling collisions.
    // If the ball leaves the course, stop
    // rather than pretending it hit something.

    if (
      ball.x < -ball.radius ||
      ball.x > W + ball.radius ||
      ball.y < -ball.radius
    ) {

      escaped = true;
      return;

    }

    // The ball has left the bottom.

    if (ball.y > H + ball.radius) {

      if (
        likes >= GOAL &&
        ball.x > holeLeft &&
        ball.x < holeRight
      ) {

        finished = true;

      } else {

        escaped = true;

      }

      return;

    }

  }

}

// DRAW A RED LINE

function drawLine(ax, ay, bx, by) {

  ctx.beginPath();

  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);

  ctx.stroke();

}

// DRAW THE HEART

function drawHeart(x, y, size) {

  ctx.save();

  ctx.translate(x, y);
  ctx.scale(size, size);

  ctx.beginPath();

  ctx.moveTo(0, 0.35);

  ctx.bezierCurveTo(
    -1.1, -0.4,
    -0.7, -1.1,
    0, -0.45
  );

  ctx.bezierCurveTo(
    0.7, -1.1,
    1.1, -0.4,
    0, 0.35
  );

  ctx.closePath();

  ctx.fillStyle = "#ff304b";
  ctx.fill();

  ctx.restore();

}

// DRAW THE BALL

function drawBall() {

  const gradient = ctx.createRadialGradient(
    ball.x - 3,
    ball.y - 4,
    1,
    ball.x,
    ball.y,
    ball.radius
  );

  gradient.addColorStop(0, "#ffffff");
  gradient.addColorStop(0.35, "#c6d0d9");
  gradient.addColorStop(1, "#46515d");

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = gradient;
  ctx.fill();

}

// DRAW THE GAME

function drawGame() {

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = "#edf8ff";

  ctx.fillRect(0, 0, W, H);

  // TITLE

  ctx.textAlign = "center";
  ctx.fillStyle = "#34445d";

  ctx.font = "bold 12px Arial";

  ctx.fillText(
    "1,000 LIKES TO DROP!",
    W / 2,
    24
  );

  // RED RAMPS

  ctx.strokeStyle = "#df3048";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ramps.forEach(ramp => {

    drawLine(
      ramp.ax,
      ramp.ay,
      ramp.bx,
      ramp.by
    );

  });

  // NARROW VERTICAL OPENING

  drawLine(
    holeLeft,
    wallTop,
    holeLeft,
    gateY
  );

  drawLine(
    holeRight,
    wallTop,
    holeRight,
    gateY
  );

  // HEART GATE

  if (likes < GOAL) {

    drawLine(
      holeLeft,
      gateY,
      holeRight,
      gateY
    );

    drawHeart(
      W / 2,
      gateY - 8,
      11
    );

  } else {

    // Heart moves below the opening
    // when the gate unlocks.

    drawHeart(
      W / 2,
      gateY + 19,
      11
    );

  }

  // SILVER BALL

  if (!finished && !escaped) {

    drawBall();

  }

  // SUCCESS

  if (finished) {

    ctx.fillStyle = "#169b59";

    ctx.font = "bold 24px Arial";

    ctx.fillText(
      "YOU DID IT!",
      W / 2,
      325
    );

  }

  // A ball that genuinely leaves the ramps
  // can be restarted with Reset.

  if (escaped) {

    ctx.fillStyle = "#34445d";

    ctx.font = "bold 15px Arial";

    ctx.fillText(
      "PRESS RESET",
      W / 2,
      325
    );

  }

}

// ANIMATION

let previousTime = 0;

function animate(time) {

  if (time - previousTime >= 16) {

    moveBall();

    drawGame();

    previousTime = time;

  }

  requestAnimationFrame(animate);

}

refreshCounter();

requestAnimationFrame(animate);

</script>

</body>
</html>
