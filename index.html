
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>1,000 Likes to Drop!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #191f2b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 440px;
  margin: auto;
  padding: 8px;
}

.counter {
  font-size: 29px;
  font-weight: bold;
  margin: 8px 0 12px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #edf8ff;
  border-radius: 5px;
}

details {
  margin-top: 12px;
  padding: 10px;
  background: #29374b;
  border-radius: 8px;
}

summary {
  cursor: pointer;
}

input {
  width: 125px;
  padding: 10px;
  font-size: 17px;
  border: none;
  border-radius: 5px;
}

button {
  padding: 10px;
  margin: 4px;
  background: #df3048;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<div class="counter" id="counter">
❤️ 0 / 1,000
</div>

<canvas
  id="game"
  width="340"
  height="400">
</canvas>

<details id="controls">

<summary>⚙ Controls</summary>

<p>Enter your current likes</p>

<input
  id="likesInput"
  type="number"
  min="0"
  value="0"
>

<button id="updateBtn">UPDATE</button>

<br>

<button id="plus10">+10</button>
<button id="plus50">+50</button>
<button id="plus100">+100</button>

<br>

<button id="pauseBtn">PAUSE</button>
<button id="resetBtn">RESET</button>

</details>

</div>

<script>

// ===================================
// GAME SETTINGS
// ===================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 340;
const H = 400;

const GOAL = 1000;

let likes = 0;
let paused = false;
let completed = false;
let releaseRequested = false;

// ===================================
// BALL
// ===================================

const BALL_RADIUS = 10;

// Larger number means slower movement.

const BALL_SPEED = 0.65;

const ball = {
  x: 100,
  y: 75
};

// ===================================
// ORIGINAL APPROVED RAMPS
// DO NOT CHANGE
// ===================================

const leftRamp = {
  x1: 16,
  y1: 105,
  x2: 156,
  y2: 193
};

const rightRamp = {
  x1: 323,
  y1: 62,
  x2: 184,
  y2: 193
};

// ===================================
// HEART OPENING
// ===================================

const holeLeft = 156;
const holeRight = 184;

const wallTop = 193;
const gateY = 225;

// Ball diameter: 20 pixels.
// Opening width: 28 pixels.

// ===================================
// ANIMATION PATH
// ===================================

// These positions control the ball.
// The ramps themselves never move.
//
// The ball approaches the visible
// ramps and changes direction.
//
// The path loops until the goal.

const route = [

  {x:100, y:75},

  // Contact near left ramp.
  {x:70, y:153},

  // Bounce upward.
  {x:163, y:52},

  // Contact near right ramp.
  {x:265, y:132},

  // Bounce across the board.
  {x:176, y:78},

  // Contact near left ramp.
  {x:112, y:179},

  // Bounce upward again.
  {x:207, y:63},

  // Contact near right ramp.
  {x:234, y:161},

  // Approach the heart.
  {x:170, y:211},

  // Bounce away before entering.
  {x:117, y:83},

  // Return toward starting area.
  {x:100, y:75}

];

// Animation durations in milliseconds.

const durations = [
  1700,
  2100,
  1800,
  2100,
  1700,
  2300,
  1700,
  2200,
  2300,
  2100
];

let segment = 0;
let elapsed = 0;

let lastFrame = null;

// ===================================
// LIKE COUNTER
// ===================================

function updateCounter() {

  document.getElementById("counter").textContent =
    "❤️ " + likes.toLocaleString() + " / 1,000";

}

function setLikes(value) {

  if (completed) return;

  const n = Number(value);

  if (!Number.isFinite(n) || n < 0) {
    return;
  }

  likes = Math.floor(n);

  document.getElementById("likesInput").value = likes;

  updateCounter();

  if (likes >= GOAL) {
    releaseRequested = true;
  } else {
    releaseRequested = false;
  }

}

document.getElementById("updateBtn").onclick =
  function() {

    setLikes(
      document.getElementById("likesInput").value
    );

  };

document.getElementById("plus10").onclick =
  () => setLikes(likes + 10);

document.getElementById("plus50").onclick =
  () => setLikes(likes + 50);

document.getElementById("plus100").onclick =
  () => setLikes(likes + 100);

// ===================================
// PAUSE AND RESET
// ===================================

document.getElementById("pauseBtn").onclick =
  function() {

    paused = !paused;

    this.textContent =
      paused ? "PLAY" : "PAUSE";

  };

function resetGame() {

  likes = 0;
  paused = false;
  completed = false;
  releaseRequested = false;

  segment = 0;
  elapsed = 0;

  releasing = false;
  releaseElapsed = 0;

  ball.x = route[0].x;
  ball.y = route[0].y;

  lastFrame = null;

  document.getElementById("likesInput").value = 0;

  document.getElementById("pauseBtn").textContent =
    "PAUSE";

  updateCounter();

}

document.getElementById("resetBtn").onclick =
  resetGame;

// ===================================
// DRAW RED LINES
// ===================================

function line(x1,y1,x2,y2) {

  ctx.beginPath();

  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);

  ctx.stroke();

}

// ===================================
// HEART
// ===================================

function heart(x,y,size) {

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(size,size);

  ctx.beginPath();

  ctx.moveTo(0,0.4);

  ctx.bezierCurveTo(
    -1.1,-0.3,
    -0.9,-1.1,
    0,-0.45
  );

  ctx.bezierCurveTo(
    0.9,-1.1,
    1.1,-0.3,
    0,0.4
  );

  ctx.closePath();

  ctx.fillStyle = "#ff304b";
  ctx.fill();

  ctx.restore();

}

// ===================================
// SILVER BALL
// ===================================

function drawBall() {

  const gradient = ctx.createRadialGradient(
    ball.x-3,
    ball.y-4,
    1,
    ball.x,
    ball.y,
    BALL_RADIUS
  );

  gradient.addColorStop(0,"#ffffff");
  gradient.addColorStop(0.4,"#c5ced7");
  gradient.addColorStop(1,"#46515d");

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    BALL_RADIUS,
    0,
    Math.PI*2
  );

  ctx.fillStyle = gradient;
  ctx.fill();

}

// ===================================
// DRAW GAME
// ===================================

function drawGame() {

  ctx.clearRect(0,0,W,H);

  ctx.fillStyle = "#edf8ff";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";

  ctx.font = "bold 12px Arial";
  ctx.fillStyle = "#34445d";

  ctx.fillText(
    "1,000 LIKES TO DROP!",
    W/2,
    24
  );

  ctx.strokeStyle = "#df3048";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Original ramps, unchanged.

  line(
    leftRamp.x1,
    leftRamp.y1,
    leftRamp.x2,
    leftRamp.y2
  );

  line(
    rightRamp.x1,
    rightRamp.y1,
    rightRamp.x2,
    rightRamp.y2
  );

  // Vertical sides.

  line(
    holeLeft,
    wallTop,
    holeLeft,
    gateY
  );

  line(
    holeRight,
    wallTop,
    holeRight,
    gateY
  );

  // Heart gate.

  if (likes < GOAL) {

    line(
      holeLeft,
      gateY,
      holeRight,
      gateY
    );

    heart(
      W/2,
      gateY-8,
      11
    );

  } else {

    heart(
      W/2,
      gateY+19,
      11
    );

  }

  if (!completed) {
    drawBall();
  }

  if (completed) {

    ctx.font = "bold 26px Arial";
    ctx.fillStyle = "#169b59";

    ctx.fillText(
      "YOU DID IT!",
      W/2,
      330
    );

  }

}

// ===================================
// MOVEMENT
// ===================================

function interpolate(a,b,t) {

  return a+(b-a)*t;

}

// Smooth movement between points.

function smooth(t) {

  return t*t*(3-2*t);

}

// ===================================
// RELEASE
// ===================================

let releasing = false;
let releaseElapsed = 0;
let releaseStart = null;

function startRelease() {

  releasing = true;
  releaseElapsed = 0;

  releaseStart = {
    x: ball.x,
    y: ball.y
  };

}

function moveRelease(delta) {

  releaseElapsed += delta;

  // Approach the heart.

  if (releaseElapsed < 2000) {

    const t = smooth(
      Math.min(releaseElapsed/2000,1)
    );

    ball.x = interpolate(
      releaseStart.x,
      170,
      t
    );

    ball.y = interpolate(
      releaseStart.y,
      211,
      t
    );

  } else {

    // Pass through the open gate.

    const t = Math.min(
      (releaseElapsed-2000)/1700,
      1
    );

    ball.x = 170;
    ball.y = 211+220*t*t;

    if (t >= 1) {
      completed = true;
    }

  }

}

// ===================================
// MAIN BALL MOVEMENT
// ===================================

function moveBall(delta) {

  if (paused || completed) {
    return;
  }

  if (releasing) {

    moveRelease(delta);
    return;

  }

  // Release only when the counter
  // reaches 1,000 likes.

  if (releaseRequested) {

    startRelease();
    moveRelease(delta);
    return;

  }

  // Controlled movement prevents
  // accidental entry into the hole.

  elapsed += delta*BALL_SPEED;

  const start = route[segment];
  const end = route[segment+1];

  const duration = durations[segment];

  const progress = Math.min(
    elapsed/duration,
    1
  );

  const t = smooth(progress);

  ball.x = interpolate(
    start.x,
    end.x,
    t
  );

  ball.y = interpolate(
    start.y,
    end.y,
    t
  );

  if (progress >= 1) {

    elapsed = 0;
    segment++;

    if (segment >= route.length-1) {
      segment = 0;
    }

  }

}

// ===================================
// ANIMATION LOOP
// ===================================

function animate(time) {

  if (lastFrame === null) {
    lastFrame = time;
  }

  const delta = Math.min(
    time-lastFrame,
    50
  );

  lastFrame = time;

  moveBall(delta);
  drawGame();

  requestAnimationFrame(animate);

}

// ===================================
// START GAME
// ===================================

updateCounter();

requestAnimationFrame(animate);

</script>

</body>
</html>
